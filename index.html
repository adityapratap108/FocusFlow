<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main>
        <nav>
            <div class="left">FocusFlow</div>
            <div class="right"><button id="toggle-modal">Add new Task</button></div>
        </nav>
        <section class="board">
            <div id="todo" class="task-column">
                <div class="heading">
                    <div class="left">To Do</div>
                    <div class="right">0</div>
                </div>
            </div>
            <div id="progress" class="task-column">
                <div class="heading">
                    <div class="left">In Progress</div>
                    <div class="right">0</div>
                </div>
            </div>
            <div id="done" class="task-column">
                <div class="heading">
                    <div class="left">Completed Tasks</div>
                    <div class="right">0</div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal add-new-task">
        <div class="bg"></div>
        <div class="center">
            <input type="text" id="input-task-title" placeholder="Task Title">
            <textarea placeholder="Task Description" id="input-task-desc"></textarea>
            <button id="add-new-task" class="add-task-btn">Add Task</button>
        </div>
    </div>

    <div class="developerCredits">
        <div class="dcBody">
            <span>Adityapratap Singh</span>
            <a href="https://github.com/adityapratap108" target="_blank" class="social-icon github">
                <i class="fab fa-github"></i> <span>Github</span>
            </a>
            <a href="https://www.linkedin.com/in/adityapratap-singh-443982383" target="_blank" class="social-icon linkedin">
                <i class="fab fa-linkedin"></i> <span>LinkedIn</span>
            </a>
            <a href="mailto:adityapratapsingh1008@gmail.com" class="nav-btn">Get In Touch</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
